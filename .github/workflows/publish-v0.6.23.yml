name: Publish Mining Rig v0.6.23 JAR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0.6.23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Verify release version
        run: grep -q '^version=0.6.23$' gradle.properties
      - name: Compile Fabric mod
        run: gradle build --stacktrace
      - name: Verify distributable JAR
        run: |
          test -s build/libs/caszual-mining-rig-0.6.23.jar
          unzip -t build/libs/caszual-mining-rig-0.6.23.jar | tail -1
      - name: Publish downloadable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.23 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.6.23 build/libs/caszual-mining-rig-0.6.23.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.6.23 build/libs/caszual-mining-rig-0.6.23.jar \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Caszual Mining Rig v0.6.23 — Full-speed group drilling" \
              --notes "Fabric Minecraft 26.2. Restores all three drill bits per drill each tick (13 drills, up to 39 parallel mining lanes) while caching group wall/fluid scan locations and retaining optimized chunk and CC network bookkeeping. Download the JAR asset below and place it in your mods folder."
          fi
