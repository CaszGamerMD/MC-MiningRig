name: Publish Mining Rig v0.6.25 JAR

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v0.6.25.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Confirm release version
        run: grep -q '^version=0.6.25$' gradle.properties
      - name: Run drill multiblock, alarm and locator regression checks
        run: python3 scripts/drill_single_item_alarm_locator_smoke.py
      - name: Build Fabric 26.2 JAR
        run: gradle build --stacktrace
      - name: Verify standalone JAR
        run: |
          test -s build/libs/caszual-mining-rig-0.6.25.jar
          unzip -t build/libs/caszual-mining-rig-0.6.25.jar | tail -1
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.25 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.6.25 build/libs/caszual-mining-rig-0.6.25.jar --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.6.25 build/libs/caszual-mining-rig-0.6.25.jar \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Caszual Mining Rig v0.6.25 — Single-item drill and visual indicators" \
              --notes "Fabric Minecraft 26.2. The two-block drill now picks and breaks as one mining_drill item from either half; the upper housing has a blinking red fault lamp, and the computer's SELECT action highlights its drill with a cyan locator. Includes the v0.6.24 next-layer preparation and 3% worn-bit return."
          fi
