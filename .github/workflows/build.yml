name: Fabric 26.2 Build
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Check CC Organizer mode/selection/retrieval control routing
        run: python3 scripts/cc_organizer_control_smoke.py
      - name: Check Target Chalk undo UI and 256-point outlines
        run: python3 scripts/target_chalk_editor_smoke.py
      - name: Check Netherite Drill Bit smithing recipe
        run: python3 scripts/netherite_bit_smithing_smoke.py
      - name: Check 13-drill fair scheduling and group excavation performance
        run: python3 scripts/group_mining_performance_smoke.py
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: miningrig-26.2
          path: build/libs/*.jar
