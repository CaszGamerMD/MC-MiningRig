name: Fabric 26.2 Build
on:
  push:
    branches: [ 'art/caszual-suite-redesign',main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - run: gradle build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: miningrig-26.2
          path: build/libs/*.jar
